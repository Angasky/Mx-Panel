name: Go preview release

on:
  push:
    branches:
      - main
      - local/migration-continue
    tags:
      - 'go-v*'
    paths:
      - '.github/workflows/go-release.yml'
      - 'cmd/**'
      - 'deploy/**'
      - 'internal/**'
      - 'templates/**'
      - 'index.html'
      - 'go.mod'
      - 'go.sum'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Compile and check Go backend
        run: go build ./... && go vet ./...
  release:
    if: startsWith(github.ref, 'refs/tags/go-v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Build and verify both release archives
        run: |
          version="${GITHUB_REF_NAME#go-}"
          [[ "$version" =~ ^v(0|[1-9][0-9]{0,8})\.(0|[1-9][0-9]{0,8})\.(0|[1-9][0-9]{0,8})$ ]]
          out=$(bash deploy/build-go-release.sh "$version")
          (cd "$out" && sha256sum --strict -c SHA256SUMS)
          stage=$(mktemp -d)
          trap 'rm -rf -- "$stage"' EXIT
          tar -xzf "$out/mxioc-go-$version-linux-amd64.tar.gz" -C "$stage"
          (
            cd "$stage"
            sha256sum --strict -c SHA256SUMS
            bash -n install-go.sh
            printf '%s\n' 'ci-only-password' | ./mxioc --root data --auth auth.json --bootstrap-user ci-admin
            ./mxioc --root data --auth auth.json --check-data
          )
      - name: Publish preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#go-}"
          gh release create "$GITHUB_REF_NAME" --verify-tag --prerelease --title "Go preview $version" --generate-notes \
            "dist/go-$version/"*.tar.gz "dist/go-$version/SHA256SUMS"
