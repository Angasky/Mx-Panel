name: Go preview release

on:
  push:
    branches:
      - go-rewrite
    tags:
      - 'go-v*'
    paths:
      - '.github/workflows/go-release.yml'
      - 'cmd/**'
      - 'deploy/**'
      - 'internal/**'
      - 'templates/**'
      - 'index.html'
      - 'go.mod'
      - 'go.sum'

permissions:
  contents: read

jobs:
  systemd:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Build two lifecycle fixtures
        run: |
          CGO_ENABLED=0 go build -trimpath -ldflags '-X main.releaseVersion=v0.0.1' -o "$RUNNER_TEMP/mxioc-old" ./cmd/mxioc
          CGO_ENABLED=0 go build -trimpath -ldflags '-X main.releaseVersion=v0.0.2' -o "$RUNNER_TEMP/mxioc-new" ./cmd/mxioc
      - name: Verify systemd install, upgrade, rollback and uninstall
        run: |
          sudo env GITHUB_ACTIONS="$GITHUB_ACTIONS" RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" \
            bash deploy/test-go-systemd.sh "$RUNNER_TEMP/mxioc-old" "$RUNNER_TEMP/mxioc-new"
  release:
    if: startsWith(github.ref, 'refs/tags/go-v')
    needs: systemd
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: go test ./... && go vet ./...
      - name: Build and verify both release archives
        run: |
          version="${GITHUB_REF_NAME#go-}"
          [[ "$version" =~ ^v(0|[1-9][0-9]{0,8})\.(0|[1-9][0-9]{0,8})\.(0|[1-9][0-9]{0,8})$ ]]
          out=$(bash deploy/build-go-release.sh "$version")
          (cd "$out" && sha256sum --strict -c SHA256SUMS)
          stage=$(mktemp -d)
          trap 'rm -rf -- "$stage"' EXIT
          tar -xzf "$out/mxioc-go-$version-linux-amd64.tar.gz" -C "$stage"
          (
            cd "$stage"
            sha256sum --strict -c SHA256SUMS
            bash -n install-go.sh
            printf '%s\n' 'ci-only-password' | ./mxioc --root data --auth auth.json --bootstrap-user ci-admin
            ./mxioc --root data --auth auth.json --check-data
          )
      - name: Publish preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#go-}"
          gh release create "$GITHUB_REF_NAME" --verify-tag --prerelease --title "Go preview $version" --generate-notes \
            "dist/go-$version/"*.tar.gz "dist/go-$version/SHA256SUMS"
