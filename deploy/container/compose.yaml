name: mx-panel
services:
  panel:
    image: ${MX_PANEL_IMAGE:-mx-panel:v0.1.33}
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:size=64m,mode=1777"]
    volumes:
      - panel-data:/var/lib/mx-panel
    ports:
      - "${MX_PANEL_BIND:-0.0.0.0}:${MX_PANEL_HTTPS_PORT:-8443}:${MX_PANEL_TLS_PORT:-8443}"
      - "${MX_PANEL_BIND:-0.0.0.0}:${MX_PANEL_HTTP_PORT:-8080}:80"
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:62578/healthz]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s
    stop_grace_period: 25s
  gateway:
    image: ${MX_PANEL_IMAGE:-mx-panel:v0.1.33}
    command: [gateway]
    restart: unless-stopped
    init: true
    network_mode: service:panel
    depends_on:
      panel:
        condition: service_healthy
        restart: true
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:size=16m,mode=1777"]
    volumes:
      - ./access.json:/etc/mx-panel/access.json:ro
      - panel-certificates:/etc/mx-panel/certificates
  setup:
    image: ${MX_PANEL_IMAGE:-mx-panel:v0.1.33}
    profiles: [setup]
    command: [init, admin]
    stdin_open: true
    tty: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:size=16m,mode=1777"]
    volumes:
      - panel-data:/var/lib/mx-panel
volumes:
  panel-data:
  panel-certificates:
